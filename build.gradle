plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'top.mczhengyi'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.22.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

sourceSets.main.resources {
    exclude 'console/**', 'ui/**'
}

tasks.register('processUiResources', Sync) {
    from project(':console').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn ':console:assemble', tasks.named('processResources')
}

tasks.register('downloadDependencies', Exec) {
    workingDir layout.projectDirectory
    if (System.properties['os.name'].toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'download_dist.bat'
    } else {
        commandLine 'bash', 'download_dist.sh'
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('downloadDependencies')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('jar') {
    exclude 'console/**'
}

halo {
    version = '2.26'
    superAdminUsername = 'admin'
    superAdminPassword = 'admin'
    externalUrl = 'http://localhost:8090'
    debug = true
}
